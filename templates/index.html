{% extends "base.html" %}
{% block title %}Recipes - mealier{% endblock %}
{% block content %}
<h1>Recipes</h1>
<p><a href="/recipes/new">New recipe</a></p>
<form method="post" action="/recipes/import">
  <input type="url" name="url" placeholder="https://example.com/recipe" aria-label="Recipe URL" required>
  <button type="submit">Import from URL</button>
</form>
<form method="get" action="/" role="search">
  <input type="search" name="q" value="{{ q }}" placeholder="Search recipes" aria-label="Search recipes" autofocus
         hx-get="/" hx-trigger="input changed delay:300ms, search" hx-target="#list" hx-select="#list" hx-swap="outerHTML" hx-push-url="true">
</form>
<ul id="list">
{% for r in recipes %}
  <li><a href="/recipes/{{ r.id }}">{{ r.name }}</a></li>
{% else %}
  <li>No recipes found.</li>
{% endfor %}
</ul>
{% endblock %}
