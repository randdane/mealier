[package]
name = "mealier"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "io-util", "time"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
axum = { version = "0.8.9", features = ["multipart"] }
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }
sha2 = "0.11.1"
utoipa = "6"
askama = "0.16"
askama_web = { version = "0.16", features = ["axum-0.8"] }
serde_urlencoded = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
scraper = "0.29.0"
libc = "0.2.191"
url = "2.5.8"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
argon2 = "0.6.0"
getrandom = "0.4.3"
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
tokio-util = { version = "0.7.20", features = ["io"] }

[dev-dependencies]
http-body-util = "0.1.5"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
tempfile = "3"
tower = { version = "0.5.3", features = ["util"] }

# Decoding and resizing photos is far too slow unoptimised for the tests to be pleasant.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.moxcms]
opt-level = 3
